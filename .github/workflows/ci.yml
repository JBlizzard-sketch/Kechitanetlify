name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kechita
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run migrations
        run: psql ${{ secrets.DATABASE_URL }} -f migrations/001_create_tables.sql || true
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps || true
      - name: Run unit tests
        run: npm test || true
      - name: Run Playwright E2E
        run: npx playwright test --project=chromium || true
      - name: Run accessibility checks
        run: npx playwright test e2e/accessibility.spec.ts || true
      - name: Run Lighthouse CI
        run: npx lhci autorun || true
      - name: Build
        run: npm run build || true
