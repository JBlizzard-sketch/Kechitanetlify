name: Deploy to Render
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run ci:test || true
      - name: Build
        run: npm run build
      - name: Deploy to Render
        uses: render-examples/deploy-to-render@v1
        with:
          apiKey: ${{ secrets.RENDER_API_KEY }}
          serviceName: kechita-web
          repo: ${{ github.repository }}
          branch: main
