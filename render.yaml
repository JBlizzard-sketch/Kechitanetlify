services:
  - type: web
    name: kechita-web
    env: docker
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    buildCommand: npm ci && npm run build
    startCommand: npm run start:dev
    envVars:
      - key: DATABASE_URL
      - key: REDIS_URL
      - key: SUPABASE_URL
      - key: SUPABASE_ANON_KEY
      - key: OPENAI_API_KEY
      - key: SENTRY_DSN
      - key: MPESA_KEY
      - key: MPESA_SECRET
      - key: MPESA_SHORTCODE
      - key: MPESA_PASSKEY
      - key: BASE_URL
  - type: worker
    name: kechita-worker
    env: docker
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
      - key: REDIS_URL
      - key: SENTRY_DSN
